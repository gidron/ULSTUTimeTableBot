version: "3.9"
services:
#  bot:
#    build: .
#    depends_on:
#      redis:
#        condition: service_started
#      postgres:
#        condition: service_healthy
#    env_file:
#      - .env
#    volumes:
#      - ./logs:/app/logs
#    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6378:6379"
    restart: unless-stopped

  postgres:
    image: postgres:17
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    ports:
      - "5431:5432"
    volumes:
      - postgres_data_timetable_bot:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data_timetable_bot:
