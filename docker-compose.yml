#      - ./logs:/app/logs
#    restart: unless-stopped

  # Порт на хосте 6378 -> внутри контейнера 6379. Локальный бот: REDIS_HOST=127.0.0.1 REDIS_PORT=6378.
  # Сервис bot в сети compose: REDIS_HOST=redis REDIS_PORT=6379 (без публикации порта на хост).
  # При VPN (Amnezia и др.): если ломается loopback к опубликованному порту, проверьте split tunnel
  # и конфликт iptables с Docker; см. также REDIS_* в .env.
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6378:6379"
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    ports:
      - "5431:5432"
    volumes:
      - postgres_data_timetable_bot:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data_timetable_bot:
